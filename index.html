<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>عداد التسبيح الإسلامي</title>
  <style>
    body { background: #0a0a0a; color: white; text-align: center; font-family: Arial; padding-top: 50px; }
    #counter { font-size: 100px; margin: 30px; color: #00ff88; }
    button { font-size: 30px; padding: 20px 40px; margin: 10px; border: none; border-radius: 15px; cursor: pointer; }
    #tasbeeh { background: #00ff88; color: black; }
    #reset { background: #ff4444; color: white; }
  </style>
</head>
<body>
  <h1>سبحان الله</h1>
  <div id="counter">0</div>
  <button id="tasbeeh" onclick="count()">اضغط للتسبيح</button>
  <button id="reset" onclick="reset()">إعادة</button>
  <script>
    let countNum = 0;
    function count() {
      countNum++;
      document.getElementById("counter").innerText = countNum;
    }
    function reset() {
      countNum = 0;
      document.getElementById("counter").innerText = 0;
    }
  </script>
